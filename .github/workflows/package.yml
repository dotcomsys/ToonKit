name: Build ToonKit packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify both ZIPs
        id: package
        shell: pwsh
        run: |
          $match = Select-String -LiteralPath 'ToonKit/ToonKit.toc' -Pattern '^## Version: ([0-9A-Za-z.-]+)$'
          if (@($match).Count -ne 1) { throw 'Expected one version in ToonKit.toc' }
          $version = $match.Matches[0].Groups[1].Value
          & ./tools/Package-Review.ps1 -Version $version -Destination release
          & ./tools/Publish-CurseForge.ps1 -PackageDirectory release -Version $version -VerifyOnly
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ToonKit-${{ steps.package.outputs.version }}
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
